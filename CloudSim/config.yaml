# CloudSim Distributed Storage System Configuration
# System-wide configuration for the distributed storage network

# Network Configuration
network:
  name: "CloudSim_Storage_Network"
  discovery:
    enabled: true
    port: 9999
    broadcast_interval_seconds: 30.0
    node_timeout_seconds: 90.0

# Node Factory Configuration
node_factory:
  start_port: 5000
  port_range_size: 1000
  auto_start_nodes: false
  graceful_shutdown_timeout: 5.0

# Storage Configuration
storage:
  base_directory: "A:\\"
  chunk_size_mb: 1
  create_directories: true

# Replication Configuration
replication:
  default_factor: 3  # Each chunk stored on 3 nodes for fault tolerance
  min_factor: 2      # Minimum replication even if user requests less
  max_factor: 6      # Maximum replication (capped at node count)

# Metrics Collection Configuration
metrics:
  enabled: true
  collection_interval_seconds: 5.0
  max_history: 1000
  export_directory: "metrics"
  auto_export: false
  export_format: "json"  # "json" or "csv"
  export_interval_seconds: 300  # 5 minutes

# Capacity Evaluation Configuration
capacity:
  enabled: true
  snapshot_interval_seconds: 60.0
  history_limit: 100
  thresholds:
    global:
      - percent: 50.0
        level: "INFO"
        description: "Storage utilization reached 50%"
      - percent: 75.0
        level: "WARNING"
        description: "Storage utilization reached 75%"
      - percent: 90.0
        level: "CRITICAL"
        description: "Storage utilization reached 90%"
      - percent: 95.0
        level: "CRITICAL"
        description: "Storage utilization reached 95%"

# Logging Configuration
logging:
  enabled: true
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  console:
    enabled: true
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    directory: "logs"
    filename: "cloudsim_{timestamp}.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5
    format: "%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s"

# Performance Settings
performance:
  max_concurrent_transfers: 10
  transfer_timeout_seconds: 300
  connection_timeout_seconds: 5.0
  socket_timeout_seconds: 30.0

# Throughput Calculation Settings
throughput:
  window_seconds: 60
  sma_window_size: 10
  ema_alpha: 0.3

# Latency and RTT Settings
latency:
  window_seconds: 300  # 5 minutes
  rtt_window_seconds: 300

# Node Configuration
# Nodes are created via CLI with custom specifications
# No config file needed
nodes:
  auto_load: false
